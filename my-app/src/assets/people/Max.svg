<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" style="image-rendering:pixelated;shape-rendering:crispEdges">
  <!-- Hair: dark brown -->
  <rect x="5" y="0" width="6" height="6" fill="#3D2012"/>
  <!-- Face: skin -->
  <rect x="6" y="2" width="4" height="4" fill="#F2C88A"/>
  <!-- Eyes -->
  <rect x="6" y="3" width="1" height="1" fill="#1A1A2E"/>
  <rect x="9" y="3" width="1" height="1" fill="#1A1A2E"/>
  <!-- Mouth: neutral -->
  <rect x="7" y="5" width="2" height="1" fill="#1A1A2E"/>
  <!-- Neck -->
  <rect x="7" y="6" width="2" height="1" fill="#F2C88A"/>
  <!-- Shirt: blue -->
  <rect x="4" y="7" width="8" height="4" fill="#2B5EA7"/>
  <!-- Pants: dark navy -->
  <rect x="4" y="11" width="3" height="3" fill="#1A3560"/>
  <rect x="9" y="11" width="3" height="3" fill="#1A3560"/>
  <!-- Shoes -->
  <rect x="3" y="14" width="4" height="2" fill="#2D1B00"/>
  <rect x="9" y="14" width="4" height="2" fill="#2D1B00"/>
</svg>
