<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Haare -->
  <rect x="24" y="10" width="16" height="8" fill="#6d4c41"/>

  <!-- Schleife (2 Dreiecke + Mitte) -->
  <polygon points="26,10 30,6 30,10" fill="#ff69b4"/>
  <polygon points="38,10 34,6 34,10" fill="#ff69b4"/>
  <rect x="30" y="8" width="4" height="3" fill="#ff1493"/>

  <!-- Kopf -->
  <rect x="24" y="16" width="16" height="12" fill="#f2c094"/>

  <!-- Körper (pink) -->
  <rect x="22" y="28" width="20" height="16" fill="#ff69b4"/>

  <!-- Beine -->
  <rect x="24" y="44" width="6" height="12" fill="#333"/>
  <rect x="34" y="44" width="6" height="12" fill="#333"/>

  <!-- Augen (fröhlicher) -->
  <rect x="28" y="20" width="2" height="2" fill="#000"/>
  <rect x="34" y="20" width="2" height="2" fill="#000"/>

  <!-- breites Lächeln -->
  <rect x="28" y="24" width="8" height="1" fill="#000"/>
  <rect x="29" y="25" width="6" height="1" fill="#000"/>
</svg>